[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asymcat"
dynamic = ["version"]
description = "A Python library for asymmetric measures of association between categorical variables in data exploration and description."
readme = "README.md"
license = "MIT"
keywords = ["statistics", "categorical", "association", "asymmetry", "information-theory", "linguistics"]
authors = [
    {name = "Tiago Tresoldi", email = "tiago.tresoldi@lingfil.uu.se"},
]
maintainers = [
    {name = "Tiago Tresoldi", email = "tiago.tresoldi@lingfil.uu.se"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "freqprob>=0.6.2",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
    "tabulate",
]

[project.optional-dependencies]
# Interactive/optional visualization backends
viz = [
    "plotly>=5.15.0",
    "bokeh>=3.2.0",
    "altair>=5.0.0",
]
# Testing dependencies (lightweight; used by the CI test matrix)
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "pytest-benchmark>=4.0.0",
    "scikit-learn>=1.0.0",
]
# Documentation site (MkDocs + mkdocstrings)
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
# Development dependencies (everything the Makefile and tests/ need)
dev = [
    # Testing
    "asymcat[test]",

    # Code quality. ruff/mypy pinned exactly so local, CI, and pre-commit run
    # identical linter versions (unpinned ruff/mypy drift silently changes
    # check results).
    "ruff==0.16.0",
    "mypy==1.19.1",
    "types-tabulate>=0.9.0",
    "types-setuptools>=68.0.0",
    "bandit[toml]>=1.9.4",

    # Bound the stub-bearing scientific deps for the type-check (quality) job,
    # which installs `.[dev]`. A new numpy/scipy release can otherwise change
    # mypy's view of third-party stubs and break the type check with no code
    # change (as numpy 2.5's PEP 695 stubs did). The runtime dependencies stay
    # unpinned so the test matrix surfaces real regressions; bump these
    # deliberately.
    "numpy<2.6",
    "scipy<1.19",

    # Build and release
    "build>=0.10.0",
    "twine>=4.0.0",
]
# All optional dependencies (runtime + development)
all = [
    "asymcat[viz,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/tresoldi/asymcat"
Documentation = "https://asymcat.tresoldi.org/"
Repository = "https://github.com/tresoldi/asymcat.git"
Issues = "https://github.com/tresoldi/asymcat/issues"
Changelog = "https://github.com/tresoldi/asymcat/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "asymcat.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["asymcat*"]

[tool.setuptools.package-data]
asymcat = ["py.typed"]


# Ruff linting (replaces flake8, pycodestyle, pyflakes, black, isort)
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "docs/archive",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
]
ignore = [
    "E203",   # whitespace before ':'
    "E501",   # line too long (ruff format handles this)
    "B904",   # exception chaining (stylistic - raise from err)
    "SIM102", # nested if statements (stylistic preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # unused function arguments in tests
    "ARG002",  # unused method arguments in tests
    "S101",    # use of assert detected (pytest uses assert)
]
"docs/tutorial_*.py" = [
    "E402",    # module level import not at top (pedagogical placement)
    "T201",    # allow print statements in tutorials
]

[tool.ruff.lint.isort]
known-first-party = ["asymcat"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy type checking
[tool.mypy]
python_version = "3.12"
files = ["src/asymcat", "tests"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
    "seaborn.*",
    "freqprob.*",
    "pytest.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests pass concrete literals (e.g. list[list[str]]) into functions annotated
# with broader unions; invariance makes mypy flag these, so relax the check
# noise in tests without loosening the type checking of the package itself.
disable_error_code = ["misc", "no-untyped-def", "method-assign", "arg-type", "list-item", "operator"]

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101"]  # Skip assert_used (assertions are acceptable outside tests)

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=asymcat",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (may take several seconds)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests that measure performance",
    "large_data: marks tests that require large datasets",
]
filterwarnings = [
    "ignore::RuntimeWarning:numpy.*",
    "ignore::FutureWarning:pandas.*",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["asymcat"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage.xml"
