[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asymcat"
version = "0.5.0"
description = "A Python library for obtaining asymmetric measures of association between categorical variables in data exploration and description"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tiago Tresoldi"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "freqprob>=0.4.0",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
    "tabulate",
]

[project.optional-dependencies]
# Runtime optional features
viz = [
    "plotly >= 5.15.0",
    "bokeh >= 3.2.0",
    "altair >= 5.0.0",
]

# All development dependencies in one group
dev = [
    # Testing
    "pytest >= 7.0.0",
    "pytest-cov >= 4.0.0",
    "pytest-xdist >= 3.0.0",
    "pytest-mock >= 3.10.0",
    "pytest-benchmark >= 4.0.0",

    # Code quality (using ruff instead of black/isort/flake8)
    "ruff >= 0.1.0",

    # Type checking
    "mypy >= 1.5.0",
    "types-tabulate >= 0.9.0",
    "types-setuptools >= 68.0.0",

    # Security
    "bandit[toml] >= 1.7.0",
    "safety >= 2.3.0",

    # Build and release
    "build >= 0.10.0",
    "twine >= 4.0.0",

    # Documentation
    "sphinx >= 7.0.0",
    "sphinx-rtd-theme >= 1.3.0",
    "myst-parser >= 2.0.0",
    "sphinx-autodoc-typehints >= 1.24.0",
    "sphinx-copybutton >= 0.5.0",
    "sphinx-design >= 0.5.0",
    "nhandu >= 0.1.0",

    # Jupyter notebooks
    "jupyter >= 1.0.0",
    "jupyterlab >= 4.0.0",
    "ipywidgets >= 8.0.0",
    "notebook >= 7.0.0",
    "nbconvert >= 7.0.0",

    # Performance profiling
    "memory-profiler >= 0.61.0",
    "line-profiler >= 4.0.0",

    # Machine learning (for tutorials)
    "scikit-learn >= 1.0.0",
]

# All features combined
all = [
    "asymcat[viz,dev]",
]

[project.urls]
Homepage = "http://github.com/tresoldi/asymcat"
Repository = "http://github.com/tresoldi/asymcat"

[tool.hatch.build.targets.wheel]
packages = ["asymcat"]

[tool.hatch.build.targets.sdist]
include = [
    "asymcat/",
    "docs/",
    "resources/",
    "scripts/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "requirements.txt",
    "Makefile",
]

[tool.hatch.build.targets.wheel.shared-data]
"docs" = "docs"
"resources" = "resources"
"scripts" = "scripts"

[tool.hatch.version]
path = "asymcat/__init__.py"

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit[toml]>=1.7.0",
    "safety>=2.3.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=asymcat --cov-branch --cov-report=html --cov-report=term {args:tests}"
format = "ruff format {args:.}"
format-check = "ruff format --check {args:.}"
lint = "ruff check {args:asymcat tests}"
typecheck = "mypy {args:asymcat}"
security = ["bandit -r asymcat/", "safety check"]
ruff-check = ["ruff check {args:asymcat tests}", "ruff format --check {args:.}"]
all-checks = ["ruff-check", "typecheck", "security", "test-cov"]

[tool.hatch.envs.docs]
dependencies = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs/source docs/build"
clean = "rm -rf docs/build"
serve = "python -m http.server 8000 -d docs/build"

[tool.hatch.envs.notebooks]
dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    "notebook>=7.0.0",
    "nbconvert>=7.0.0",
]

[tool.hatch.envs.notebooks.scripts]
execute-all = """
for notebook in docs/*.ipynb; do
    echo "Executing: $notebook"
    jupyter nbconvert --to notebook --execute --inplace "$notebook"
done
"""
check-outputs = """
for notebook in docs/*.ipynb; do
    size=$(stat --format="%s" "$notebook" 2>/dev/null || stat -f%z "$notebook")
    if [ "$size" -lt 30000 ]; then
        echo "❌ $notebook: $size bytes (missing outputs)"
        exit 1
    else
        echo "✅ $notebook: $size bytes (has outputs)"
    fi
done
"""

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# Plus: isort (I), pyupgrade (UP), and other useful rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E203", # whitespace before ':'
    "B904", # Exception chaining (stylistic - raise from err)
    "SIM102", # Nested if statements (stylistic preference)
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", "test"]
skips = ["B101"]  # Skip assert_used test since assertions are acceptable in tests

[tool.coverage.report]
exclude_lines = [
    "if __name__ == '__main__':",
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=asymcat",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (may take several seconds)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests that measure performance",
    "large_data: marks tests that require large datasets",
]
filterwarnings = [
    "ignore::RuntimeWarning:numpy.*",
    "ignore::FutureWarning:pandas.*",
    "ignore::DeprecationWarning",
]
