site_name: ASymCat
site_description: A Python library for asymmetric measures of association between categorical variables.
site_url: https://asymcat.tresoldi.org/
repo_url: https://github.com/tresoldi/asymcat
repo_name: tresoldi/asymcat
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Tutorial: getting-started/tutorial.md
  - Concepts:
      - Directional association: concepts/directional-association.md
      - Notation: concepts/notation.md
      - Choosing a measure: concepts/choosing-a-measure.md
      - Pitfalls: concepts/pitfalls.md
  - Measures:
      - measures/index.md
      - Conditional probability (mle): measures/mle.md
      - Pointwise mutual information: measures/pmi.md
      - Theil's U: measures/theil-u.md
      - Conditional entropy: measures/conditional-entropy.md
      - Mutual information: measures/mutual-information.md
      - Chi-square and Cramér's V: measures/chi2.md
      - Fisher's exact test: measures/fisher.md
      - Log-likelihood ratio (G²): measures/log-likelihood-ratio.md
      - Goodman–Kruskal λ: measures/goodman-kruskal-lambda.md
      - Jaccard index: measures/jaccard.md
      - The Tresoldi measure: measures/tresoldi.md
  - How-to guides:
      - how-to/index.md
      - Prepare co-occurrence data: how-to/prepare-data.md
      - Work with sparse data: how-to/sparse-data.md
      - Test significance and uncertainty: how-to/significance.md
      - Rank, scale and compare scores: how-to/compare-scores.md
      - Plot score matrices: how-to/plot.md
      - Summarise whole variables: how-to/whole-variables.md
  - API reference:
      - api/index.md
      - asymcat.scorer.CatScorer: api/catscorer.md
      - asymcat.scorer functions: api/scorer-functions.md
      - asymcat.common: api/common.md
      - asymcat.correlation: api/correlation.md
  - References: references.md
  - How to cite: citing.md

hooks:
  - scripts/docs_figures.py

plugins:
  - search
  - redirects:
      redirect_maps:
        USER_GUIDE.md: getting-started/tutorial.md
        TRESOLDI_MEASURE.md: measures/tresoldi.md
        reference.md: api/index.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

# LaTeX math rendering via MathJax (the User Guide uses $...$ / $$...$$).
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
